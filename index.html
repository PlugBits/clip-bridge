<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClipBridge</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #22263a;
    --accent: #5b7fff; --green: #3ecf8e; --red: #f04444;
    --text: #e8eaf0; --muted: #6b7280; --border: #2a2e42;
    --radius: 12px; --font: 'Inter', system-ui, -apple-system, sans-serif;
  }
  body {
    background: var(--bg); color: var(--text); font-family: var(--font);
    min-height: 100dvh; display: flex; flex-direction: column;
    align-items: center; padding: 20px 16px 48px;
  }
  header {
    width: 100%; max-width: 520px; display: flex;
    align-items: center; gap: 10px; margin-bottom: 20px;
  }

  /* レイアウト: 広ければ2カラム / 狭ければ1カラム */
  .layout { width: 100%; max-width: 520px; display: flex; flex-direction: column; }
  .col-left, .col-right { display: flex; flex-direction: column; min-width: 0; }
  @media (min-width: 900px) {
    header { max-width: 1056px; }
    .layout { max-width: 1056px; flex-direction: row; align-items: flex-start; gap: 16px; }
    .col-left, .col-right { flex: 1 1 0; }
    .col-right { position: sticky; top: 20px; }
    .col-right #message-list { max-height: calc(100dvh - 200px); overflow-y: auto; padding-right: 2px; }
  }
  .logo { width: 34px; height: 34px; background: var(--accent); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.3px; }
  .tagline { font-size: 12px; color: var(--muted); margin-left: auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; width: 100%; max-width: 520px; margin-bottom: 12px; }
  .card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .card-title { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .card-title.mb { margin-bottom: 12px; }
  .card-meta { margin-left: auto; font-size: 11px; color: var(--muted); }

  .btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s, background 0.15s; white-space: nowrap; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: #6b8cff; }
  .btn-ghost   { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover:not(:disabled) { border-color: var(--accent); }
  .btn-danger  { background: #2a1a1a; color: var(--red); border: 1px solid #4a2020; }
  .btn-sm      { padding: 6px 12px; font-size: 12px; }

  /* 接続 */
  .code-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .code-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; text-align: center; }
  .code-input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; font-size: 34px; font-weight: 800; color: var(--accent); letter-spacing: 0.22em; text-align: center; outline: none; font-variant-numeric: tabular-nums; transition: border-color 0.15s; }
  .code-input:focus { border-color: var(--accent); }
  .code-input::placeholder { color: var(--border); }
  .code-input:disabled { opacity: 0.7; }
  .code-actions { display: flex; gap: 6px; margin-top: 8px; }
  .code-actions .btn { flex: 1; }

  .status-bar { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--surface2); border-radius: 8px; font-size: 13px; margin-top: 10px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .dot.online  { background: var(--green); box-shadow: 0 0 5px var(--green); }
  .dot.waiting { background: var(--accent); animation: pulse 1.5s infinite; }
  .dot.error   { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* 送信 */
  .tab-row { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab-row .btn { flex: 1; padding: 8px; }

  #ios-paste-area { width: 100%; min-height: 80px; background: var(--surface2); border: 2px dashed var(--border); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--text); resize: none; outline: none; font-family: var(--font); line-height: 1.6; transition: border-color 0.15s; display: none; }
  #ios-paste-area:focus { border-color: var(--accent); border-style: solid; }
  #ios-paste-area::placeholder { color: var(--muted); }

  .drop-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 24px 16px; text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s; min-height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  .drop-zone.active { border-color: var(--accent); background: rgba(91,127,255,0.05); }
  .drop-zone.has-content { border-color: var(--green); border-style: solid; background: rgba(62,207,142,0.04); }
  .drop-icon { font-size: 28px; }
  .drop-hint { font-size: 13px; color: var(--muted); }
  .drop-hint strong { color: var(--text); }
  .drop-hint-sub { font-size: 11px; color: var(--muted); }

  #paste-trap { position: fixed; top: -9999px; left: -9999px; width: 1px; height: 1px; opacity: 0; }

  .send-row { display: flex; gap: 8px; margin-top: 10px; }
  .send-row .btn-primary { flex: 1; }

  /* 画像の容量（画質）セレクタ */
  .quality-row { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .quality-label { font-size: 12px; color: var(--muted); flex-shrink: 0; }
  .seg { display: flex; flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; gap: 3px; }
  .seg-btn { flex: 1; border: none; background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; padding: 7px 4px; border-radius: 6px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .seg-btn.active { background: var(--accent); color: #fff; }

  /* 添付一覧 */
  #pending-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  #pending-list:empty { display: none; }
  .pending-item { display: flex; align-items: center; gap: 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .pending-thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; flex-shrink: 0; }
  .pending-thumb.ic { display: flex; align-items: center; justify-content: center; background: var(--surface); font-size: 18px; }
  .pending-meta { flex: 1; min-width: 0; }
  .pending-name { font-size: 13px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .pending-size { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .pending-remove { border: none; background: transparent; color: var(--muted); font-size: 20px; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; flex-shrink: 0; }
  .pending-remove:hover { color: var(--red); background: rgba(240,68,68,0.1); }

  #direct-input { width: 100%; min-height: 90px; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; font-size: 14px; color: var(--text); resize: vertical; outline: none; font-family: var(--font); line-height: 1.6; }
  #direct-input:focus { border-color: var(--accent); }

  /* タイムライン */
  .timeline-tools { display: flex; flex-direction: column; align-items: stretch; gap: 6px; margin-bottom: 12px; }
  .btn-refresh { width: 100%; padding: 14px; font-size: 15px; }
  .timeline-subtools { display: flex; gap: 6px; justify-content: flex-end; }
  .receive-empty { text-align: center; color: var(--muted); font-size: 13px; padding: 28px 20px; }

  .msg-item { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 8px; animation: slideIn 0.2s ease; }
  .msg-item.mine { border-color: #3a4fa8; }
  .msg-item.flash { animation: flash 0.9s ease; }
  @keyframes slideIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  @keyframes flash { 0%{background:rgba(91,127,255,0.18)} 100%{background:var(--surface2)} }

  .item-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; min-height: 44px; }
  .item-header:hover { background: rgba(255,255,255,0.03); }
  .item-time { font-size: 11px; color: var(--muted); flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .item-badge { font-size: 10px; border-radius: 4px; padding: 2px 6px; flex-shrink: 0; font-weight: 600; }
  .badge-mine { color: var(--accent); background: rgba(91,127,255,0.15); }
  .badge-in   { color: var(--green);  background: rgba(62,207,142,0.15); }
  .item-thumb { width: 30px; height: 30px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
  .item-preview { flex: 1; font-size: 13px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; min-width: 0; }
  .item-preview.img { color: var(--muted); }
  .item-actions-inline { display: flex; gap: 4px; flex-shrink: 0; }
  .item-chevron { font-size: 10px; color: var(--muted); flex-shrink: 0; transition: transform 0.2s; }
  .item-chevron.open { transform: rotate(180deg); }

  .item-body { display: none; padding: 0 12px 12px; }
  .item-body.open { display: block; }
  .item-body img { max-width: 100%; max-height: 300px; border-radius: 6px; object-fit: contain; display: block; margin-bottom: 8px; }
  .item-body-text { font-size: 14px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; margin-bottom: 8px; }
  .actions { display: flex; gap: 5px; flex-wrap: wrap; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 9px 18px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.2s, transform 0.2s; pointer-events: none; white-space: nowrap; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok  { border-color: var(--green); color: var(--green); }
  #toast.err { border-color: var(--red);   color: var(--red); }
</style>
</head>
<body>

<textarea id="paste-trap"></textarea>

<header>
  <div class="logo">📋</div>
  <h1>ClipBridge</h1>
  <span class="tagline">デバイス間でコピペ</span>
</header>

<main class="layout">
<div class="col-left">

<!-- 接続 -->
<div class="card">
  <div class="card-title mb">接続</div>
  <div class="code-block">
    <div class="code-label">ルームコード（両方の端末で同じ番号を入力）</div>
    <input class="code-input" id="room-input" placeholder="0000" maxlength="4" inputmode="numeric">
    <div class="code-actions">
      <button class="btn btn-ghost btn-sm" onclick="copyCode()">コピー</button>
      <button class="btn btn-ghost btn-sm" onclick="newCode()">別の番号を生成</button>
    </div>
  </div>
  <button class="btn btn-primary" id="btn-join" onclick="joinRoom()" style="width:100%">接続</button>
  <button class="btn btn-danger" id="btn-leave" onclick="leaveRoom()" style="width:100%;display:none;margin-top:8px">切断して履歴を削除</button>
  <div class="status-bar">
    <div class="dot" id="status-dot"></div>
    <span id="status-text">準備中...</span>
  </div>
</div>

<!-- 送信 -->
<div class="card">
  <div class="card-title mb">送信</div>
  <div class="tab-row">
    <button class="btn btn-primary" id="tab-paste" onclick="switchTab('paste')">📋 ペースト</button>
    <button class="btn btn-ghost"   id="tab-text"  onclick="switchTab('text')">⌨️ テキスト入力</button>
  </div>
  <div id="pane-paste">
    <textarea id="ios-paste-area" placeholder="ここを長押し →「ペースト」をタップ"></textarea>
    <div class="drop-zone" id="drop-zone"
      onclick="focusPasteTrap()"
      ondragover="onDragOver(event)"
      ondragleave="onDragLeave(event)"
      ondrop="onDrop(event)">
      <div class="drop-icon">📤</div>
      <div class="drop-hint" id="drop-hint"><strong>クリック → Ctrl+V</strong> または画像をドロップ</div>
      <div class="drop-hint-sub">画像・テキスト対応・複数可</div>
    </div>
    <input type="file" id="file-input" accept="image/*" multiple style="display:none" onchange="onFilePick(event)">
    <button class="btn btn-ghost" id="btn-pick" style="width:100%;margin-top:8px" onclick="document.getElementById('file-input').click()">🖼️ 画像を選択（複数可）</button>
  </div>
  <div id="pane-text" style="display:none">
    <textarea id="direct-input" placeholder="ここに直接入力..." oninput="onDirectInput()"></textarea>
  </div>
  <!-- 画像の容量（画質）3段階 -->
  <div class="quality-row" id="quality-row">
    <span class="quality-label">画像の容量</span>
    <div class="seg" id="seg-quality">
      <button class="seg-btn" data-q="light" onclick="setQuality('light')">軽量</button>
      <button class="seg-btn active" data-q="standard" onclick="setQuality('standard')">標準</button>
      <button class="seg-btn" data-q="original" onclick="setQuality('original')">原寸</button>
    </div>
  </div>
  <div id="pending-list"></div>
  <div class="send-row">
    <button class="btn btn-primary" id="btn-send" onclick="sendContent()" disabled>送信</button>
    <button class="btn btn-ghost" onclick="clearContent()">クリア</button>
  </div>
</div>

</div><!-- /col-left -->
<div class="col-right">

<!-- タイムライン -->
<div class="card">
  <div class="card-head">
    <span class="card-title">タイムライン</span>
    <span class="card-meta" id="timeline-meta"></span>
  </div>
  <div class="timeline-tools" id="timeline-tools" style="display:none">
    <button class="btn btn-primary btn-refresh" onclick="reloadTimeline()">🔄 履歴を更新</button>
    <div class="timeline-subtools">
      <button class="btn btn-ghost btn-sm" id="btn-dl-all" onclick="downloadAllImages()" style="display:none">⬇️ 画像を全てDL</button>
      <button class="btn btn-ghost btn-sm" onclick="clearView()">表示をクリア</button>
    </div>
  </div>
  <div id="message-list">
    <div class="receive-empty">接続すると、送受信した内容がここに新しい順で表示されます</div>
  </div>
</div>

</div><!-- /col-right -->
</main>

<div id="toast"></div>

<script>
const SUPABASE_URL = 'https://ahrvesmafltdkrcjqfwh.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFocnZlc21hZmx0ZGtyY2pxZndoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI3NDU0MzUsImV4cCI6MjA5ODMyMTQzNX0.omwTTulKmH9WyRgo4AGVKEoAv1f3fzKesSudMFrafRo';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
// タブ単位のセッション。リロードでは維持され、タブを閉じると破棄される。
const SS_ROOM = 'clipbridge_room';
const roomStore = window.sessionStorage;
// 受信時のみ、最新の1件を数秒だけ開いた状態にしておく
const AUTO_OPEN_MS = 6000;

let channel = null;
let currentRoom = null;
let pendingItems = [];       // 送信待ちの添付（複数可）{ type, data, orig? }
let quality = 'standard';    // 画像の容量: light / standard / original

// 画像の容量プリセット（長辺の上限px と JPEG品質）
const QUALITY = {
  light:    { max: 900,  q: 0.55 },
  standard: { max: 1600, q: 0.80 },
  original: { max: 0,    q: 0 }   // 無圧縮（原寸）
};

// タイムラインの単一データソース（新しい順で表示）
let messages = [];          // { key, type, data, ts(ms), mine }
let seen = new Set();        // 重複排除用キー
let autoOpenItem = null;     // 受信時に自動展開中の1件（常に最新のみ）

function uid() {
  return (crypto.randomUUID && crypto.randomUUID()) ||
    (Date.now().toString(36) + Math.random().toString(36).slice(2));
}
function randomCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

// ---- 初期化 ----
window.addEventListener('load', () => {
  const saved = roomStore.getItem(SS_ROOM);
  document.getElementById('room-input').value = (saved && /^\d{4}$/.test(saved)) ? saved : randomCode();

  if (isIOS) {
    document.getElementById('ios-paste-area').style.display = 'block';
    document.getElementById('drop-zone').style.display = 'none';
  }
  document.getElementById('ios-paste-area').addEventListener('paste', (e) => {
    const items = e.clipboardData ? e.clipboardData.items : [];
    for (const item of items) {
      if (item.type.startsWith('image/')) {
        e.preventDefault();
        const reader = new FileReader();
        reader.onload = (ev) => { addPendingImage(ev.target.result); e.target.value = ''; };
        reader.readAsDataURL(item.getAsFile());
        return;
      }
    }
    setTimeout(() => {
      const val = e.target.value;
      if (val.trim()) { addPendingText(val); e.target.value = ''; }
    }, 50);
  });

  if (saved && /^\d{4}$/.test(saved)) {
    setStatus('waiting', '前回のルームに再接続中...');
    joinRoom(saved);
  } else {
    setStatus('waiting', '相手と同じ番号を入力して「接続」してください');
  }
});

// 画面復帰時に再接続＋タイムライン再取得
// （iPadなどでバックグラウンド中は更新が止まるため、復帰時に確実に取り直す）
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && currentRoom) {
    if (!channel || channel.state !== 'joined') {
      setStatus('waiting', '再接続中...');
      joinRoom(currentRoom);
    } else {
      loadTimeline(currentRoom);
    }
  }
});

// ---- ルーム参加 ----
async function joinRoom(forceRoomId) {
  const roomId = forceRoomId || document.getElementById('room-input').value.trim();
  if (!roomId || !/^\d{4}$/.test(roomId)) { toast('4桁の番号を入力してください', 'err'); return; }
  if (channel) { await channel.unsubscribe(); channel = null; }
  currentRoom = roomId;
  roomStore.setItem(SS_ROOM, roomId);
  setStatus('waiting', '接続中...');

  await loadTimeline(roomId);

  channel = sb.channel('clip-' + roomId, { config: { broadcast: { self: false } } });
  channel.on('broadcast', { event: 'clip' }, ({ payload }) => {
    receiveMessage(payload);
  });
  channel.subscribe((status) => {
    if (status === 'SUBSCRIBED') {
      setStatus('online', 'ルーム ' + roomId + ' に接続中');
      if (pendingItems.length) document.getElementById('btn-send').disabled = false;
      document.getElementById('btn-leave').style.display = '';
      document.getElementById('timeline-tools').style.display = 'flex';
      toast('接続しました ✓', 'ok');
    } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') {
      setStatus('error', '切断されました');
    }
  });
}

// ---- タイムライン取得（DBが全記録の単一ソース） ----
async function loadTimeline(roomId) {
  const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString();
  const { data, error } = await sb
    .from('clips')
    .select('*')
    .eq('room_id', roomId)
    .gte('created_at', oneHourAgo)
    .order('created_at', { ascending: false });

  // まっさらから作り直す（重複・順序破綻を防ぐ）
  messages = [];
  seen = new Set();
  renderAll();

  if (error) { updateMeta(); return; }
  (data || []).forEach(row => {
    addMessage({
      key: 'db:' + (row.id != null ? row.id : row.created_at),
      type: row.type,
      data: row.data,
      ts: Date.parse(row.created_at) || Date.now(),
      mine: false
    }, false);
  });
  renderAll(); // 取得時は展開しない（展開は受信時のみ）
  if (data && data.length) toast('履歴 ' + data.length + '件を取得', 'ok');
}

function reloadTimeline() {
  if (currentRoom) loadTimeline(currentRoom);
}

// ---- メッセージをモデルに追加（重複排除＋時系列ソート） ----
// 戻り値: 実際に追加されたか
function addMessage(msg, doRender = true) {
  if (seen.has(msg.key)) return false;
  seen.add(msg.key);
  let i = 0;
  while (i < messages.length && messages[i].ts >= msg.ts) i++;
  messages.splice(i, 0, msg);
  if (doRender) renderAt(i, msg);
  return true;
}

// リアルタイム受信（相手から）
function receiveMessage(payload) {
  const added = addMessage({
    key: 'rt:' + (payload.id || uid()),
    type: payload.type,
    data: payload.data,
    ts: Date.parse(payload.ts) || Date.now(),
    mine: false,
    incoming: true
  });
  if (added) toast(payload.type === 'image' ? '画像を受信しました 📷' : 'テキストを受信しました', 'ok');
}

// ---- DB保存 ----
async function saveToDb(roomId, type, data) {
  await sb.from('clips').insert({ room_id: roomId, type, data });
  const oneHourAgo = new Date(Date.now() - 60 * 60 * 1000).toISOString();
  await sb.from('clips').delete().eq('room_id', roomId).lt('created_at', oneHourAgo);
}

function copyCode() {
  const v = document.getElementById('room-input').value.trim();
  navigator.clipboard.writeText(v);
  toast('番号をコピーしました', 'ok');
}
function newCode() {
  if (currentRoom) { toast('先に切断してください', 'err'); return; }
  document.getElementById('room-input').value = randomCode();
}

// ---- PC用ペースト ----
const pasteTrap = document.getElementById('paste-trap');
pasteTrap.addEventListener('paste', (e) => {
  e.preventDefault();
  let added = false;
  for (const item of e.clipboardData.items) {
    if (item.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (ev) => addPendingImage(ev.target.result);
      reader.readAsDataURL(item.getAsFile());
      added = true;
    }
  }
  if (added) return;
  const text = e.clipboardData.getData('text');
  if (text) addPendingText(text);
  else toast('テキストか画像をコピーしてペーストしてください', 'err');
});

function focusPasteTrap() {
  pasteTrap.value = ''; pasteTrap.focus();
  document.getElementById('drop-zone').classList.add('active');
  document.getElementById('drop-hint').innerHTML = '<strong>Ctrl+V を押してください</strong>';
  pasteTrap.onblur = () => {
    document.getElementById('drop-zone').classList.remove('active');
    if (!pendingItems.length) document.getElementById('drop-hint').innerHTML = '<strong>クリック → Ctrl+V</strong> または画像をドロップ';
  };
}

function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('active'); }
function onDragLeave()  { document.getElementById('drop-zone').classList.remove('active'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('active');
  const files = Array.from(e.dataTransfer.files || []).filter(f => f.type.startsWith('image/'));
  if (files.length) {
    files.forEach(f => { const r = new FileReader(); r.onload = ev => addPendingImage(ev.target.result); r.readAsDataURL(f); });
  } else {
    const text = e.dataTransfer.getData('text');
    if (text) addPendingText(text);
  }
}

// ファイル選択（複数可）
function onFilePick(e) {
  const files = Array.from(e.target.files || []).filter(f => f.type.startsWith('image/'));
  if (!files.length) { toast('画像ファイルを選んでください', 'err'); }
  files.forEach(f => { const r = new FileReader(); r.onload = ev => addPendingImage(ev.target.result); r.readAsDataURL(f); });
  e.target.value = '';
}

// ---- 画像の圧縮（容量3段階） ----
function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}
function b64Bytes(dataURL) {
  const i = dataURL.indexOf(',');
  const b64 = i >= 0 ? dataURL.slice(i + 1) : dataURL;
  return Math.floor(b64.length * 3 / 4);
}
async function compressImage(src, level) {
  const cfg = QUALITY[level] || QUALITY.standard;
  if (level === 'original' || !cfg.max) return src;
  try {
    const img = await loadImg(src);
    let w = img.naturalWidth, h = img.naturalHeight;
    const longest = Math.max(w, h);
    if (longest > cfg.max) { const s = cfg.max / longest; w = Math.round(w * s); h = Math.round(h * s); }
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); // JPEGは透過非対応のため白背景
    ctx.drawImage(img, 0, 0, w, h);
    const out = c.toDataURL('image/jpeg', cfg.q);
    // スクショ等で逆に大きくなる場合は元画像を使う
    return b64Bytes(out) < b64Bytes(src) ? out : src;
  } catch { return src; }
}

// dataURL のおおよそのバイト数を表示用に整形
function fmtSize(dataURL) {
  const bytes = b64Bytes(dataURL);
  return bytes >= 1024 * 1024 ? (bytes / 1024 / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1024)) + ' KB';
}

// ---- 添付キュー ----
async function addPendingImage(src) {
  const data = await compressImage(src, quality);
  pendingItems.push({ type: 'image', orig: src, data });
  renderPending();
}
function addPendingText(text) {
  pendingItems.push({ type: 'text', data: text });
  renderPending();
}

function renderPending() {
  const wrap = document.getElementById('pending-list');
  wrap.innerHTML = '';
  pendingItems.forEach((it, idx) => {
    const row = document.createElement('div'); row.className = 'pending-item';
    if (it.type === 'image') {
      const t = document.createElement('img'); t.className = 'pending-thumb'; t.src = it.data; row.appendChild(t);
      const meta = document.createElement('div'); meta.className = 'pending-meta';
      const nm = document.createElement('div'); nm.className = 'pending-name'; nm.textContent = '画像 ' + (idx + 1);
      const sz = document.createElement('div'); sz.className = 'pending-size'; sz.textContent = fmtSize(it.data);
      meta.appendChild(nm); meta.appendChild(sz); row.appendChild(meta);
    } else {
      const t = document.createElement('div'); t.className = 'pending-thumb ic'; t.textContent = '📝'; row.appendChild(t);
      const meta = document.createElement('div'); meta.className = 'pending-meta';
      const nm = document.createElement('div'); nm.className = 'pending-name'; nm.textContent = it.data.split('\n').join(' ');
      meta.appendChild(nm); row.appendChild(meta);
    }
    const rm = document.createElement('button'); rm.className = 'pending-remove'; rm.textContent = '×';
    rm.onclick = () => { pendingItems.splice(idx, 1); renderPending(); };
    row.appendChild(rm);
    wrap.appendChild(row);
  });

  const n = pendingItems.length;
  if (!isIOS) {
    document.getElementById('drop-zone').classList.toggle('has-content', n > 0);
    document.getElementById('drop-hint').innerHTML = n > 0
      ? '📎 ' + n + '件を添付済み'
      : '<strong>クリック → Ctrl+V</strong> または画像をドロップ';
  }
  const send = document.getElementById('btn-send');
  send.textContent = n > 1 ? '送信 (' + n + ')' : '送信';
  send.disabled = !(n > 0 && currentRoom);
}

// 容量プリセットの切り替え（添付済み画像も再圧縮）
async function setQuality(q) {
  quality = q;
  document.querySelectorAll('#seg-quality .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.q === q));
  for (const it of pendingItems) {
    if (it.type === 'image' && it.orig) it.data = await compressImage(it.orig, q);
  }
  renderPending();
}

function clearContent() {
  pendingItems = [];
  if (!isIOS) {
    document.getElementById('drop-zone').classList.remove('has-content', 'active');
    document.getElementById('drop-hint').innerHTML = '<strong>クリック → Ctrl+V</strong> または画像をドロップ';
  }
  document.getElementById('pending-list').innerHTML = '';
  const send = document.getElementById('btn-send');
  send.textContent = '送信'; send.disabled = true;
}

// ---- タブ ----
function switchTab(tab) {
  document.getElementById('pane-paste').style.display = tab === 'paste' ? '' : 'none';
  document.getElementById('pane-text').style.display  = tab === 'text'  ? '' : 'none';
  document.getElementById('quality-row').style.display = tab === 'paste' ? '' : 'none';
  document.getElementById('tab-paste').className = 'btn ' + (tab === 'paste' ? 'btn-primary' : 'btn-ghost');
  document.getElementById('tab-text').className  = 'btn ' + (tab === 'text'  ? 'btn-primary' : 'btn-ghost');
  document.getElementById('direct-input').value = '';
  clearContent();
}

function onDirectInput() {
  const val = document.getElementById('direct-input').value;
  pendingItems = val.trim() ? [{ type: 'text', data: val }] : [];
  const send = document.getElementById('btn-send');
  send.textContent = '送信';
  send.disabled = !(pendingItems.length && currentRoom);
}

// ---- 送信（複数まとめて） ----
async function sendContent() {
  if (!channel || !currentRoom) { toast('接続されていません', 'err'); return; }
  if (!pendingItems.length) { toast('送信するデータがありません', 'err'); return; }
  const batch = pendingItems.slice();
  document.getElementById('btn-send').disabled = true;
  for (const it of batch) {
    const id = uid();
    const ts = new Date().toISOString();
    const payload = { id, type: it.type, data: it.data, ts };
    try { await channel.send({ type: 'broadcast', event: 'clip', payload }); } catch (e) { /* 続行 */ }
    await saveToDb(currentRoom, it.type, it.data);
    addMessage({ key: 'rt:' + id, type: it.type, data: it.data, ts: Date.now(), mine: true });
  }
  toast(batch.length > 1 ? batch.length + '件を送信しました ✓' : '送信しました ✓', 'ok');
  clearContent();
  if (document.getElementById('pane-text').style.display !== 'none') {
    document.getElementById('direct-input').value = '';
  }
}

// ---- レンダリング ----
function renderAll() {
  const list = document.getElementById('message-list');
  autoOpenItem = null; // 作り直すので参照をリセット
  list.innerHTML = '';
  if (messages.length === 0) {
    list.innerHTML = '<div class="receive-empty">' +
      (currentRoom ? 'まだ送受信はありません' : '接続すると、送受信した内容がここに新しい順で表示されます') +
      '</div>';
  } else {
    messages.forEach(m => list.appendChild(buildItem(m)));
  }
  updateMeta();
}

function renderAt(index, msg) {
  const list = document.getElementById('message-list');
  const empty = list.querySelector('.receive-empty');
  if (empty) empty.remove();
  const node = buildItem(msg, !!msg.incoming); // 受信は数秒だけ開いて中身を見せる
  const ref = list.children[index];
  if (ref) list.insertBefore(node, ref); else list.appendChild(node);
  if (msg.incoming) { node.classList.add('flash'); }
  updateMeta();
}

function updateMeta() {
  document.getElementById('timeline-meta').textContent =
    messages.length ? messages.length + '件（過去1時間）' : '';
  const dl = document.getElementById('btn-dl-all');
  if (dl) dl.style.display = messages.some(m => m.type === 'image') ? '' : 'none';
}

function fmtTime(ms) {
  const d = new Date(ms), now = new Date();
  const t = d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return t;
  return d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) + ' ' + t;
}

function buildItem(m, autoOpen = false) {
  const isImg = m.type === 'image';
  const item = document.createElement('div');
  item.className = 'msg-item' + (m.mine ? ' mine' : '');

  const header = document.createElement('div');
  header.className = 'item-header';

  const timeEl = document.createElement('span');
  timeEl.className = 'item-time';
  timeEl.textContent = fmtTime(m.ts);
  header.appendChild(timeEl);

  if (m.mine) {
    const b = document.createElement('span');
    b.className = 'item-badge badge-mine'; b.textContent = '送信';
    header.appendChild(b);
  } else if (m.incoming) {
    const b = document.createElement('span');
    b.className = 'item-badge badge-in'; b.textContent = '受信';
    header.appendChild(b);
  }

  if (isImg) {
    const thumb = document.createElement('img');
    thumb.className = 'item-thumb'; thumb.src = m.data;
    header.appendChild(thumb);
    const prev = document.createElement('span');
    prev.className = 'item-preview img'; prev.textContent = '画像';
    header.appendChild(prev);
  } else {
    const prev = document.createElement('span');
    prev.className = 'item-preview';
    prev.textContent = m.data.split('\n').join(' ');
    header.appendChild(prev);
    const wrap = document.createElement('div');
    wrap.className = 'item-actions-inline';
    wrap.appendChild(mkBtn('コピー', 'btn-ghost btn-sm', (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(m.data);
      toast('コピーしました ✓', 'ok');
    }));
    header.appendChild(wrap);
  }

  const chevron = document.createElement('span');
  chevron.className = 'item-chevron'; chevron.textContent = '▼';
  header.appendChild(chevron);

  const body = document.createElement('div');
  body.className = 'item-body';
  if (isImg) {
    const img = document.createElement('img'); img.src = m.data;
    body.appendChild(img);
  } else {
    const p = document.createElement('div');
    p.className = 'item-body-text'; p.textContent = m.data;
    body.appendChild(p);
  }

  const actions = document.createElement('div');
  actions.className = 'actions';
  if (isImg) {
    if (!isIOS) actions.appendChild(mkBtn('コピー', 'btn-ghost btn-sm', () => copyImage(m.data)));
    actions.appendChild(mkBtn('ダウンロード', 'btn-primary btn-sm', () => downloadImage(m.data)));
  } else {
    actions.appendChild(mkBtn('コピー', 'btn-ghost btn-sm', () => {
      navigator.clipboard.writeText(m.data); toast('コピーしました ✓', 'ok');
    }));
  }
  actions.appendChild(mkBtn('表示を削除', 'btn-danger btn-sm', () => {
    item.remove();
    const idx = messages.indexOf(m);
    if (idx > -1) { messages.splice(idx, 1); seen.delete(m.key); }
    if (messages.length === 0) renderAll(); else updateMeta();
  }));
  body.appendChild(actions);

  // 受信時のみ、最新の1件だけを数秒だけ開いておき、その後自動で閉じる
  if (autoOpen) {
    if (autoOpenItem) { // それ以前に自動展開したものは閉じる（常に最新の1件のみ）
      clearTimeout(autoOpenItem.timer);
      autoOpenItem.body.classList.remove('open');
      autoOpenItem.chevron.classList.remove('open');
    }
    body.classList.add('open');
    chevron.classList.add('open');
    const timer = setTimeout(() => {
      body.classList.remove('open');
      chevron.classList.remove('open');
      if (autoOpenItem && autoOpenItem.timer === timer) autoOpenItem = null;
    }, AUTO_OPEN_MS);
    item._collapseTimer = timer;
    autoOpenItem = { body, chevron, timer };
  }

  header.addEventListener('click', () => {
    clearTimeout(item._collapseTimer); // 手動操作したら自動開閉を止める
    if (autoOpenItem && autoOpenItem.timer === item._collapseTimer) autoOpenItem = null;
    const open = body.classList.toggle('open');
    chevron.classList.toggle('open', open);
  });

  item.appendChild(header);
  item.appendChild(body);
  return item;
}

function mkBtn(label, cls, fn) {
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.textContent = label; b.onclick = fn; return b;
}

function clearView() {
  messages = []; seen = new Set();
  renderAll();
}

async function copyImage(src) {
  try {
    const img = new Image(); img.src = src;
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; });
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);
    canvas.toBlob(async (blob) => {
      try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]); toast('画像をコピーしました ✓', 'ok'); }
      catch { toast('コピー不可。ダウンロードを使ってください', 'err'); }
    }, 'image/png');
  } catch { toast('コピー不可。ダウンロードを使ってください', 'err'); }
}

function downloadImage(src, idx = 0) {
  const ext = src.startsWith('data:image/jpeg') ? 'jpg' : 'png';
  const a = document.createElement('a'); a.href = src;
  a.download = 'clip-' + Date.now() + '-' + idx + '.' + ext; a.click();
}

// タイムライン上の画像を1枚ずつまとめてダウンロード（ZIPにはしない）
async function downloadAllImages() {
  const imgs = messages.filter(m => m.type === 'image');
  if (!imgs.length) { toast('画像がありません', 'err'); return; }
  toast(imgs.length + '枚をダウンロードします', 'ok');
  for (let i = 0; i < imgs.length; i++) {
    downloadImage(imgs[i].data, i);
    await new Promise(r => setTimeout(r, 350)); // 連続DLがブロックされないよう間隔
  }
}

async function leaveRoom() {
  if (!currentRoom) return;
  await sb.from('clips').delete().eq('room_id', currentRoom);
  if (channel) { await channel.unsubscribe(); channel = null; }
  currentRoom = null;
  roomStore.removeItem(SS_ROOM);
  setStatus('waiting', '相手と同じ番号を入力して「接続」してください');
  document.getElementById('btn-leave').style.display = 'none';
  document.getElementById('timeline-tools').style.display = 'none';
  messages = []; seen = new Set();
  renderAll();
  document.getElementById('btn-send').disabled = true;
  toast('切断して履歴を削除しました', 'ok');
}

function setStatus(state, text) {
  document.getElementById('status-dot').className = 'dot ' + state;
  document.getElementById('status-text').textContent = text;
}

let toastTimer = null;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2500);
}
</script>
